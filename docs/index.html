<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liverpool Canvas Assistant</title>
<meta name="description" content="Liverpool Canvas Assistant：让你常用的 AI 帮你处理利物浦大学 Canvas 上的事，盯 DDL、看新通知、读作业要求和讲义、查成绩、下课件。用学校账号正常登录，只读。学生维护的非官方开源工具。">
<link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml">
<style>
:root {
  --s0: #f5f5f3; --s1: #fcfcfb; --s2: #ffffff;
  --text: #20201e; --text-2: #373634; --muted: #6b6863; --faint: #a4a19b;
  --line: #e7e5df; --line-strong: #dedcd6;
  --clay: #d97757; --clay-strong: #cc5a36; --clay-tint: #fbf3ef; --on-clay: #ffffff;
  --code: #f5f5f3;
  --ring: 0 0.25rem 1.25rem rgba(0,0,0,.035), inset 0 0 0 1px var(--line);
  --pop: 0 12px 40px rgba(32,32,30,.08), 0 2px 6px rgba(32,32,30,.04), inset 0 0 0 1px var(--line);
  --ease: cubic-bezier(.165,.84,.44,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --s0: #151515; --s1: #1a1a19; --s2: #20201e;
    --text: #f5f5f3; --text-2: #dedcd6; --muted: #a4a19b; --faint: #6b6863;
    --line: #2e2d2b; --line-strong: #373634;
    --clay: #d97757; --clay-strong: #e08a6c; --clay-tint: #2b211c; --on-clay: #ffffff;
    --code: #262624;
    --ring: 0 0.25rem 1.25rem rgba(0,0,0,.25), inset 0 0 0 1px var(--line);
    --pop: 0 12px 40px rgba(0,0,0,.4), inset 0 0 0 1px var(--line);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --s0: #151515; --s1: #1a1a19; --s2: #20201e;
  --text: #f5f5f3; --text-2: #dedcd6; --muted: #a4a19b; --faint: #6b6863;
  --line: #2e2d2b; --line-strong: #373634;
  --clay: #d97757; --clay-strong: #e08a6c; --clay-tint: #2b211c; --on-clay: #ffffff;
  --code: #262624;
  --ring: 0 0.25rem 1.25rem rgba(0,0,0,.25), inset 0 0 0 1px var(--line);
  --pop: 0 12px 40px rgba(0,0,0,.4), inset 0 0 0 1px var(--line);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--s1); color: var(--text); font: 16px/1.7 Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
p { text-wrap: pretty; }
a { color: var(--clay-strong); text-underline-offset: 3px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
.nowrap { white-space: nowrap; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--s1) 86%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid transparent; transition: border-color .2s var(--ease); }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); text-decoration: none; white-space: nowrap; }
.brand img { width: 26px; height: 26px; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav a, .nav button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; transition: background .12s var(--ease), color .12s var(--ease); white-space: nowrap; }
.nav a:hover, .nav button:hover { background: var(--s0); color: var(--text); }
@media (max-width: 720px) { .nav .hide-sm { display: none; } }

/* hero */
.hero { padding-top: 64px; padding-bottom: 48px; display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: var(--s2); box-shadow: var(--ring); padding: 4px 12px 4px 8px; border-radius: 999px; margin-bottom: 22px; }
.eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--clay); box-shadow: 0 0 0 3px var(--clay-tint); }
.hero h1 { font-size: clamp(34px, 5vw, 50px); line-height: 1.14; font-weight: 650; }
.hero h1 em { font-style: normal; color: var(--clay); }
.hero .lead { font-size: 18px; color: var(--muted); margin: 18px 0 28px; max-width: 520px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; padding: 0; list-style: none; }
.chips li { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chips li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--clay); }
.chips li + li { margin-left: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 20px; border-radius: 10px; border: 0; cursor: pointer; text-decoration: none; transition: background .12s var(--ease), box-shadow .12s var(--ease), transform .06s var(--ease); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--clay); color: var(--on-clay); }
.btn.primary:hover { background: var(--clay-strong); }
.btn.secondary { background: var(--s2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.secondary:hover { background: var(--s0); }
.btn:focus-visible, summary:focus-visible, .nav a:focus-visible, .nav button:focus-visible, .cmd button:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

/* chat illustration */
.chat { background: var(--s2); border-radius: 20px; box-shadow: var(--pop); padding: 22px; display: grid; gap: 16px; }
.bubble-user { justify-self: end; background: var(--s0); border-radius: 14px; padding: 10px 14px; max-width: 88%; font-size: 15px; }
.answer { font-size: 15px; color: var(--text-2); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.spark { width: 18px; height: 18px; color: var(--clay); flex: none; }
.items { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.items li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 12px; border-radius: 10px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); }
.items b { font-weight: 600; color: var(--text); }
.items span { font-size: 13px; color: var(--muted); }
.items .st { grid-row: span 2; align-self: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.st.hot { color: var(--clay-strong); background: var(--clay-tint); }
.st.calm { color: var(--muted); background: var(--s0); }
.composer { display: flex; align-items: center; gap: 10px; border-radius: 16px; padding: 10px 10px 10px 16px; box-shadow: 0 0.25rem 1.25rem rgba(0,0,0,.035), inset 0 0 0 1px var(--line-strong); font-size: 15px; }
.composer .typed { flex: 1; color: var(--text); min-height: 1.6em; }
.composer .typed::after { content: ""; display: inline-block; width: 2px; height: 1.05em; background: var(--clay); margin-left: 2px; vertical-align: -0.15em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.composer .send { width: 32px; height: 32px; border-radius: 9px; background: var(--clay); color: #fff; display: grid; place-items: center; flex: none; }
.mock-note { text-align: center; font-size: 12px; color: var(--faint); margin-top: 10px; }

/* sections */
section { padding: 76px 0; scroll-margin-top: 60px; }
section.alt { background: var(--s0); }
.head { max-width: 660px; margin-bottom: 36px; }
.head h2 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 650; line-height: 1.25; }
.head p { color: var(--muted); margin: 12px 0 0; font-size: 17px; }

.caps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.cap { background: var(--s2); border-radius: 14px; box-shadow: var(--ring); padding: 20px; display: grid; align-content: start; gap: 8px; transition: box-shadow .2s var(--ease), transform .2s var(--ease); }
.cap:hover { box-shadow: var(--pop); transform: translateY(-1px); }
.cap .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--clay-tint); color: var(--clay-strong); display: grid; place-items: center; margin-bottom: 4px; }
.cap h3 { font-size: 17px; font-weight: 600; }
.cap p { margin: 0; color: var(--muted); font-size: 15px; }
.cap q { display: block; margin-top: 4px; font-size: 14px; color: var(--text-2); background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); border-radius: 10px; padding: 8px 12px; quotes: none; }
.cap.wide { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.cap.wide .ico { margin: 0; }

.convos { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.convo { background: var(--s2); border-radius: 20px; box-shadow: var(--ring); padding: 22px; display: grid; gap: 14px; align-content: start; }
.convo .answer p { margin: 0 0 8px; }
.convo .answer p:last-child { margin: 0; }
.convo .found { font-size: 12px; color: var(--faint); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.step { background: var(--s2); border-radius: 14px; box-shadow: var(--ring); padding: 22px; }
.step .n { width: 28px; height: 28px; border-radius: 8px; background: var(--clay-tint); color: var(--clay-strong); font-weight: 650; display: grid; place-items: center; font-size: 14px; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.step h3 { font-size: 17px; font-weight: 600; }
.step p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.prompt-card { margin-top: 20px; background: var(--s2); border-radius: 20px; box-shadow: var(--pop); padding: 22px; }
.prompt-card .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.prompt-card .row strong { font-weight: 600; }
.prompt-card .row small { display: block; color: var(--muted); font-size: 14px; }
.prompt-text { margin: 16px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; line-height: 1.65; color: var(--text-2); white-space: pre-wrap; max-height: 188px; overflow: auto; overflow-wrap: anywhere; }

.self { margin-top: 16px; background: var(--s2); border-radius: 14px; box-shadow: var(--ring); padding: 18px 20px; }
.self-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.self-head strong { font-weight: 600; display: block; }
.self-how { margin: 12px 0 4px; font-size: 15px; color: var(--text-2); }
.seg { display: inline-flex; background: var(--s0); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 5px 14px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--s2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06), inset 0 0 0 1px var(--line); }
.self-head small { display: block; color: var(--muted); font-size: 14px; margin: 2px 0 6px; }
.self-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.self-note code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--s0); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.daily { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
.flow { display: grid; gap: 0; align-content: start; }
.flow-item { background: var(--s2); border-radius: 14px; box-shadow: var(--ring); padding: 18px 20px; display: grid; gap: 4px; }
.flow-item b { font-weight: 600; font-size: 16px; }
.flow-item > span:last-child { color: var(--muted); font-size: 15px; }
.flow-item.once { background: var(--s1); }
.flow-arrow { width: 2px; height: 22px; background: var(--line-strong); margin-left: 32px; }
.tag-once, .tag-every { justify-self: start; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px; margin-bottom: 4px; }
.tag-once { color: var(--muted); background: var(--s0); }
.tag-every { color: var(--clay-strong); background: var(--clay-tint); }
.say { display: grid; gap: 8px; }
.say button { font: inherit; font-size: 15px; text-align: left; color: var(--text); background: var(--s1); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; transition: box-shadow .12s var(--ease); }
.say button:hover { box-shadow: inset 0 0 0 1px var(--clay); }
.say button small { color: var(--faint); font-size: 12px; flex: none; }
.tips { margin-top: 22px; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tips li { background: var(--s2); border-radius: 14px; box-shadow: var(--ring); padding: 16px; }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.rules .card { background: var(--s2); border-radius: 14px; box-shadow: var(--ring); padding: 22px; }
.rules h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.list li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.list svg { margin-top: 4px; color: var(--clay); }
.list b { font-weight: 600; display: block; }
.list span { color: var(--muted); font-size: 15px; }
.note { margin: 18px 0 0; font-size: 14px; color: var(--muted); background: var(--s2); box-shadow: var(--ring); border-radius: 12px; padding: 14px 16px; }

details { background: var(--s2); border-radius: 12px; box-shadow: var(--ring); margin: 0 0 10px; }
summary { list-style: none; cursor: pointer; padding: 16px 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 12px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 8px; height: 8px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(45deg); transition: transform .2s var(--ease); flex: none; margin-top: -4px; }
details[open] summary::after { transform: rotate(225deg); margin-top: 4px; }
details .body { padding: 0 18px 16px; color: var(--muted); font-size: 15px; }
details .body p { margin: 0 0 10px; }
.faq { max-width: 760px; }

.cmd { display: flex; align-items: stretch; margin: 8px 0; border-radius: 10px; overflow: hidden; background: var(--code); box-shadow: inset 0 0 0 1px var(--line); }
.cmd code { flex: 1; padding: 10px 12px; font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); overflow-x: auto; white-space: pre; }
.cmd button { border: 0; border-left: 1px solid var(--line); background: var(--s2); color: var(--text-2); font: inherit; font-size: 13px; padding: 0 14px; cursor: pointer; }
.cmd button:hover { color: var(--clay-strong); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--clay-strong); background: var(--clay-tint); border-radius: 6px; padding: 1px 8px; }

footer { padding: 36px 0 48px; color: var(--faint); font-size: 13px; border-top: 1px solid var(--line); }
footer p { margin: 0 0 8px; max-width: 780px; }
footer a { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--s1); padding: 10px 16px; border-radius: 10px; font-size: 14px; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; padding-top: 36px; gap: 36px; }
  .caps, .steps, .convos, .rules, .daily, .tips { grid-template-columns: 1fr; }
  .cap.wide { grid-column: auto; grid-template-columns: 1fr; }
  section { padding: 54px 0; }
  .prompt-card .row .btn { width: 100%; }
}
@media (min-width: 861px) and (max-width: 1000px) { .caps { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }
</style>
</head>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#"><img src="assets/icon.svg?v=2" alt=""> Liverpool Canvas Assistant</a>
    <nav class="nav">

    </nav>

<main>
<div class="wrap hero">
  <div>
    <div class="eyebrow"><span class="dot"></span><span data-zh="给利物浦大学同学的免费 AI 助理" data-en="A free AI assistant for University of Liverpool students"></span></div>
    <h1 data-zh-html="Canvas 上的事，<br><span class=&quot;nowrap&quot;>交给 <em>AI</em> 盯着</span>" data-en-html="Let <em>AI</em> handle<br>your Canvas"></h1>
    <p class="lead" data-zh="DDL 快到了、老师发了新通知、作业要求怎么写、讲义讲了什么、成绩出了没、课件在哪下，在你常用的 AI 里直接问。用学校账号正常登录，不用折腾。" data-en="Deadlines coming up, a new announcement, what the brief asks for, what the slides say, whether grades are out, where the files are: just ask the AI you already use. Sign in with your normal university account."></p>
    <div class="cta">
      <a class="btn primary" href="#setup" data-zh="让 AI 帮我装好" data-en="Let my AI set it up"></a>
      <a class="btn secondary" href="#what" data-zh="看看能做什么" data-en="See what it can do"></a>
    </div>
    <ul class="chips">
      <li data-zh="免费开源" data-en="Free & open source"></li>
      <li data-zh="只读不改" data-en="Read-only"></li>
      <li data-zh="密码不经过 AI" data-en="Your password never reaches the AI"></li>
    </ul>
  </div>

  <div aria-hidden="true">
    <div class="chat">
      <div class="bubble-user" data-zh="这周有什么 DDL？老师有没有发新通知？" data-en="Any deadlines this week? Anything new from my lecturers?"></div>
      <div class="answer">
        <div class="who"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg><span data-zh="你的 AI 助理" data-en="Your AI assistant"></span></div>
        <ul class="items">
          <li><b>MATH253 Assignment 1</b><span class="st hot" data-zh="未提交" data-en="Not submitted"></span><span data-zh="周五 17:00 截止（英国时间）" data-en="Due Fri 17:00 UK time"></span></li>
          <li><b>MATH268 Quiz 3</b><span class="st calm" data-zh="已提交" data-en="Submitted"></span><span data-zh="周日 23:59 截止" data-en="Due Sun 23:59"></span></li>
          <li><b data-zh="新通知 · MATH253" data-en="New · MATH253"></b><span class="st hot" data-zh="新" data-en="New"></span><span data-zh="“周四的课改到 Room 102”" data-en="“Thursday's class moves to Room 102”"></span></li>
        </ul>
      </div>
      <div class="composer"><span class="typed" id="typed"></span><span class="send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></span></div>
    </div>
    <p class="mock-note" data-zh="示意图，课程和内容为虚构" data-en="Illustration; courses and content are fictional"></p>
  </div>
</div>

<section id="setup" class="alt">
  <div class="wrap">
    <div class="head">
      <h2 data-zh="三步装好，不用懂技术" data-en="Three steps, no tech skills needed"></h2>
      <p data-zh="用 Claude 桌面版（Code 功能）或 Codex 这类能操作电脑的 AI，发一段话让它帮你装；或者自己在终端里运行一条命令。两种都会带你登录学校账号、选一个 AI 应用接上。" data-en="Ask an AI that can act on your computer (the Code feature in the Claude desktop app, or Codex) to set it up with one message, or run one command yourself. Either way you sign in and pick an AI app to connect."></p>
    </div>
    <div class="steps">
      <div class="step"><div class="n">1</div><h3 data-zh="复制下面这段话，发给 AI" data-en="Copy the message below and send it to your AI"></h3><p data-zh="它会一步步装好，中间问你几个简单问题，比如课件存到哪。" data-en="It sets things up step by step and asks a couple of simple questions, like where to save files."></p></div>

<section id="faq">
  <div class="wrap faq">
    <div class="head"><h2 data-zh="常见问题" data-en="Questions"></h2></div>
    <details><summary data-zh="需要准备什么？" data-en="What do I need?"></summary><div class="body"><p data-zh="一台 Mac 或 Windows 电脑，装好 Chrome 或 Edge（Windows 自带 Edge）就够了。运行环境 Node.js 不用自己装：安装命令发现电脑上没有，会从 nodejs.org 下载官方版本，放在你的用户文件夹里，不需要管理员密码。" data-en="A Mac or Windows computer with Chrome or Edge (Windows has Edge). You don't need to install Node.js yourself: if it's missing, the install command downloads the official version from nodejs.org into your user folder, no admin password needed."></p></div></details>
    <details><summary data-zh="能用网页版的 ChatGPT / Claude 吗？" data-en="Can I use ChatGPT or Claude in the browser?"></summary><div class="body"><p data-zh="网页聊天没法在你的电脑上安装和运行程序，所以接不上。需要能在电脑上操作的 AI 应用，比如 Claude 桌面版、Claude Code 或 Codex。" data-en="A web chat can't install or run anything on your computer, so it can't connect. You need an AI app that runs on your computer, such as the Claude desktop app, Claude Code or Codex."></p></div></details>
    <details><summary data-zh="弹出的登录窗口为什么没有我平时的登录？" data-en="Why isn't the sign-in window logged in like my normal browser?"></summary><div class="body"><p data-zh="那是一个单独的浏览器窗口，专门用来登录 Canvas，不会碰你平时浏览器里的账号。登录成功后会自动关闭。" data-en="It's a separate browser window just for Canvas and doesn't touch your everyday browser accounts. It closes by itself once you're in."></p></div></details>
    <details><summary data-zh="过几天 AI 说要重新登录？" data-en="After a few days the AI asks me to sign in again?"></summary><div class="body"><p data-zh="Canvas 的登录会过期。学校登录还记得你的话，窗口会自动完成；否则在弹出的窗口里重新登录一次就好。" data-en="Canvas sign-ins expire. If the university sign-in still remembers you, the window completes by itself; otherwise just sign in again."></p></div></details>
    <details><summary data-zh="下载的文件存在哪里？" data-en="Where do downloaded files go?"></summary><div class="body"><p data-zh="你说存哪就存哪。在 Codex 或 Claude Code 里打开一个文件夹，说“下到这里”或“下到 papers 文件夹”，文件就直接存进那个文件夹。没说的话，AI 会先问你：存到当前打开的文件夹、“文稿/Canvas”，还是别的地方。" data-en="Wherever you say. Open a folder in Codex or Claude Code and say “save it here” or “put it in a papers folder”, and the files go straight there. If you don't say, the AI asks first: the folder you have open, Documents/Canvas, or somewhere else."></p></div></details>
    <details><summary data-zh="下载课件会重复下、覆盖我改过的文件吗？" data-en="Will downloads duplicate or overwrite my files?"></summary><div class="body"><p data-zh="不会。下过的文件直接跳过，你改过的文件不会被替换；老师更新了文件会提醒你，但保留你本地的版本。不想用 AI 也可以：让 AI 帮你“打开下载页面”，在页面里勾选课程下载。" data-en="No. Files you have are skipped and your edits are never replaced; if a lecturer updates a file you're told, and your copy is kept. Without AI, ask it once to “open the download page” and tick courses there."></p></div></details>
    <details><summary data-zh="怎么退出、删除？" data-en="How do I sign out or remove it?"></summary><div class="body"><p data-zh="跟 AI 说“退出 Canvas 登录”即可清除这台电脑上的登录状态，已下载的课件不会删。不用了的话，让 AI 把它从 AI 应用的设置里移除。" data-en="Ask your AI to “sign out of Canvas” to clear the sign-in on this computer; downloaded files stay. To stop using it, ask your AI to remove it from the app's settings."></p></div></details>
    <details><summary data-zh="没有 GitHub 账号能装吗？" data-en="Can I install it without a GitHub account?"></summary><div class="body"><p data-zh="能。代码是公开的，下载不需要任何账号。让 AI 帮你装的话，它会自己处理；自己装的话，按“安装”里的命令运行就行。" data-en="Yes. The code is public, and downloading it needs no account. If your AI sets it up, it handles this; otherwise run the commands under “Set up”."></p></div></details>
  </div>
</section>

    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
    chart: '<path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    down: '<path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/>',
  };
  const CAPS = [
    ['clock', '盯着 DDL', 'Watch your deadlines', '所有课程接下来要交什么、交了没、有没有逾期，按英国时间算。', 'What is due across all courses, whether you submitted, what is overdue, in UK time.', '这周有什么 DDL？哪些还没交？', 'Any deadlines this week? What haven\'t I submitted?'],
    ['bell', '新通知不漏看', 'Never miss an announcement', '老师发的公告和附件，帮你挑出重要的：改时间、改教室、发新材料。', 'Lecturers\' announcements and attachments, with the important bits picked out.', '老师最近发了什么？有没有改时间？', 'What did lecturers post recently? Any changes?'],
    ['list', '作业要求和评分标准', 'Briefs and rubrics', '把作业说明、评分标准和附带的文件一起读完，整理成清单。', 'Reads the brief, rubric and attached files together and turns them into a checklist.', '这次作业要我交什么？怎么打分？', 'What does this assignment want, and how is it marked?'],
    ['book', '读讲义、帮你总结', 'Read and summarise slides', 'PDF、Word 讲义直接读成文字，总结重点、出复习题、找某个概念在哪讲的。', 'Reads PDF and Word slides, summarises them, makes revision questions, finds where a topic is covered.', '读一下第三周的讲义，总结重点', 'Read the week 3 slides and summarise them'],
    ['chart', '成绩和老师反馈', 'Grades and feedback', '你自己的分数和老师评语，一次看全。', 'Your own scores and lecturer comments in one place.', '这门课我现在多少分？老师怎么评价的？', 'What is my grade so far, and what was the feedback?'],
    ['cal', '考试、日程和课表', 'Exams and calendar', '日历里的考试、课程活动、答疑时间。', 'Tests, class events and office hours from your calendar.', '下个月有哪些考试？', 'Which tests are next month?'],
    ['chat', '讨论区和站内信', 'Discussions and Inbox', '讨论区里大家怎么说、老师给你发的站内信。', 'What people said in discussions, and messages from tutors.', '讨论区里关于第二题大家怎么说？', 'What did people say about Q2 in the discussion?'],
    ['down', '课件和试卷，想存哪就存哪', 'Course files and papers, wherever you want them', '在 Codex、Claude Code 里打开一个文件夹，说“下到这里”就直接存进去；整门课也能一次下完，以后只下新的。下过的不重复，你改过的不覆盖。', 'Open a folder in Codex or Claude Code and say “save it here”; whole courses download in one go, and later only new files. Nothing is downloaded twice or overwritten.', '把这份试卷下到这个文件夹', 'Save this exam paper into this folder'],
  ];
  const SAY = [
    ['这周 Canvas 上有什么 DDL？哪些还没交？', 'What is due on Canvas this week, and what haven\'t I submitted?'],
    ['MATH253 老师最近发了什么通知？', 'Any new announcements in MATH253?'],
    ['用 Liverpool Canvas 把 COMP207 第五周的讲义下到这个文件夹', 'Use Liverpool Canvas to save the COMP207 week 5 slides into this folder'],
    ['帮我补一下所有课的新文件', 'Fetch any new files for my courses'],
  ];
  const TYPED = [['老师最近发了什么通知？', 'Anything new from my lecturers?'], ['读一下第三周的讲义，帮我总结重点', 'Summarise the week 3 slides for me'], ['Assignment 2 什么时候交？要求是什么？', 'When is Assignment 2 due, and what does it want?']];

  function promptText() {
    return [
      T('请帮我安装并接入 Liverpool Canvas Assistant，用于我的利物浦大学 Canvas。', 'Please install and connect Liverpool Canvas Assistant for my University of Liverpool Canvas account.'),
      `${T('项目仓库', 'Repository')}: ${repo || T('（尚未发布）', '(not published yet)')}`,
      `${T('npm 包与版本', 'npm package and version')}: ${R.published ? `${R.npmPackage}@${R.version}` : T('（尚未发布到 npm，请按 README 用 git clone 安装）', '(not on npm yet; install with git clone as the README says)')}`,
      `${T('学校地址', 'Canvas address')}: https://canvas.liverpool.ac.uk`,
      '',
      T('请先阅读项目 README，检查 Node.js 和 Chrome/Edge，然后按项目已验证的命令开始设置。', 'First read the project README, check Node.js and Chrome/Edge, then start setup with the commands the project documents.'),
      T('让我在新开的学校登录窗口里自己输入账号、密码和 MFA，不要让我把密码发到聊天里。', 'Let me type my account, password and MFA myself in the sign-in window it opens; never ask me to send my password in the chat.'),
      T('帮我确认适用的 AI 客户端并配置对应 MCP 服务；保留原设置并备份，不修改其他客户端。', 'Help me pick the AI app to use and configure its MCP server; keep and back up its existing settings, and do not change other apps.'),
      T('接入完成后，我希望能查询课程、作业截止与提交状态、公告、作业要求和评分标准，也能读取资料、查看成绩反馈、讨论、站内信和日历。', 'Afterwards I want to ask about courses, deadlines and submission status, announcements, assignment briefs and rubrics, and read files, grades and feedback, discussions, Inbox messages and the calendar.'),
      T('如果我选择直接使用本地网页，请按该路径启动。', 'If I choose to use the local page instead, start that.'),
      T('下载前让我选择课程和下载目录；如果我说“下到这里”，就存进我当前打开的文件夹。默认只下载本地没有的文件，已有文件不要重复下载、覆盖或移动。', 'Before downloading, let me choose the courses and the folder; if I say “save it here”, use the folder I have open. Only download files I do not have; never download again, overwrite or move existing files.'),
      T('如果你没有本地终端或文件操作能力，请提供我可以自己执行的具体步骤，不要声称已经完成安装。', 'If you cannot use a terminal or files on my computer, give me exact steps to do it myself, and do not claim the installation is done.'),
    ].join('\n');
  }

  const svg = (k) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
  function render() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    for (const el of document.querySelectorAll('[data-zh]')) el.textContent = lang === 'zh' ? el.dataset.zh : el.dataset.en;
    for (const el of document.querySelectorAll('[data-zh-html]')) el.innerHTML = lang === 'zh' ? el.dataset.zhHtml : el.dataset.enHtml;
    $('langBtn').textContent = lang === 'zh' ? 'EN' : '中文';
    $('caps').innerHTML = CAPS.map((c) => `<div class="cap"><span class="ico">${svg(c[0])}</span><h3>${esc(T(c[1], c[2]))}</h3><p>${esc(T(c[3], c[4]))}</p><q>“${esc(T(c[5], c[6]))}”</q></div>`).join('')
      + `<div class="cap wide"><span class="ico">${svg('chat')}</span><p>${esc(T('还有更多：模块和课程页面、任意 Canvas 只读数据……你在 Canvas 网页上能看到的，都可以直接问。', 'And more: modules, course pages, any read-only Canvas data. If you can see it on Canvas, you can ask about it.'))}</p></div>`;
    $('prompt').textContent = promptText();
    $('sayList').innerHTML = SAY.map((x) => `<button type="button" data-copy="${esc(T(x[0], x[1]))}"><span>“${esc(T(x[0], x[1]))}”</span><small>${T('复制', 'Copy')}</small></button>`).join('');
    for (const b of document.querySelectorAll('#osSeg button')) b.setAttribute('aria-pressed', String(b.dataset.os === os));
    $('osSeg').hidden = !R.published;
    $('osHow').textContent = !R.published ? '' : os === 'win'
      ? T('在开始菜单搜索“PowerShell”并打开，粘贴下面这一行，按回车：', 'Open “PowerShell” from the Start menu, paste this line and press Enter:')
      : T('打开“终端”（按 ⌘ 空格，输入“终端”），粘贴下面这一行，按回车：', 'Open Terminal (press ⌘ Space and type “Terminal”), paste this line and press Enter:');
    $('manualCmds').innerHTML = steps().map((c) => `<div class="cmd"><code>${esc(c)}</code><button type="button" data-copy="${esc(c)}">${T('复制', 'Copy')}</button></div>`).join('');
    $('manualMore').innerHTML = R.published
      ? `${esc(T('它会问你课件存到哪、打开登录窗口，并让你选一个要接入的 AI 应用。以后想打开下载页面、重新登录或换个 AI，再运行一次同一条命令就行。', 'It asks where to save files, opens the sign-in window and lets you pick the AI app to connect. To open the download page, sign in again or switch AI apps later, run the same command again.'))}
        ${repo ? `<a href="${esc(repo)}/blob/main/docs/install.${os === 'win' ? 'ps1' : 'sh'}">${T('看看这条命令做了什么', 'See what this command does')}</a> · ` : ''}${esc(T('已经装好 Node.js 22+ 的同学也可以直接用', 'Already have Node.js 22+? You can also run'))} <code>npx -y ${esc(R.npmPackage)}@latest</code>`
      : `${esc(T('第一行需要电脑上装有 Git（免费，', 'The first line needs Git installed (free, '))}<a href="https://git-scm.com/downloads">git-scm.com</a>${esc(T('）。最后一步会问你课件存到哪、打开登录窗口，并让你选一个要接入的 AI 应用。', '). The last step asks where to save files, opens the sign-in window and lets you pick the AI app to connect.'))} <span class="pill">${T('发布到 npm 后会变成一行命令，不再需要 Git', 'Becomes a single command once on npm, no Git needed')}</span>`;
    if (repo) { $('repoLink').href = repo; $('repoLink').hidden = false; }
    $('footMeta').innerHTML = `v${esc(R.version)} · MIT${repo ? ` · <a href="${esc(repo)}">GitHub</a>` : ''} · ${T('基于', 'based on')} <a href="https://github.com/CorCvusRamboChen/canvas-session-mcp">canvas-session-mcp</a>`;
    restartTyping();
  }

  let toastTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    toast(msg || T('已复制', 'Copied'));
  }

  // The composer in the illustration types a few example questions.
  let typingTimer;
  function restartTyping() {
    clearTimeout(typingTimer);
    const el = $('typed');
    const list = TYPED.map((x) => T(x[0], x[1]));
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = list[0]; return; }
    let i = 0; let n = 0; let back = false;
    const tick = () => {
      const s = list[i];
      if (!back) {
        n++;
        if (n >= s.length) { back = true; el.textContent = s; typingTimer = setTimeout(tick, 1800); return; }
      } else {
        n -= 2;
        if (n <= 0) { back = false; n = 0; i = (i + 1) % list.length; }
      }
      el.textContent = s.slice(0, Math.max(0, n));
      typingTimer = setTimeout(tick, back ? 18 : 70);
    };
    tick();
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (b) copy(b.dataset.copy);
    const o = e.target.closest('#osSeg button');
    if (o) { os = o.dataset.os; render(); }
  });
  $('copyPrompt').addEventListener('click', () => copy(promptText(), T('已复制，粘贴给 AI 就行', 'Copied. Paste it to your AI')));
  $('langBtn').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('lc-site-lang', lang); } catch { /* ignore */ } render(); });
  addEventListener('scroll', () => $('top').classList.toggle('scrolled', scrollY > 8), { passive: true });
  render();
})();
</script>
</body>
</html>
